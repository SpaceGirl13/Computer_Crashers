layout: default
title: Peppa Pig Linux
permalink: /peppa/
---

<div id="peppa-page">
  <!-- wrapper holds position + bounce; img handles flipping -->
  <div id="peppa-wrapper">
    <img id="peppa" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Peppa_Pig.svg" alt="Peppa Pig">
  </div>

  <div id="factBox">🐷 Move your mouse and Peppa will follow! Click anywhere for a Linux fact.</div>
</div>

<style>
  /* page-level styles (safe to keep inline) */
  body {
    margin: 0;
    overflow: hidden;
    text-align: center;
    font-family: Arial, sans-serif;
  }

  /* wrapper => position + bounce animation */
  #peppa-wrapper {
    position: absolute;
    width: 150px;
    pointer-events: none;
    transition: left 0.15s linear, top 0.15s linear;
    transform-origin: center;
  }

  /* image => flip horizontally when needed */
  #peppa {
    width: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* walking bounce (applied to wrapper) */
  .walking {
    animation: walkBounce 0.3s infinite alternate;
  }
  @keyframes walkBounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-10px); }
  }

  /* flipped facing left (applied to the img element) */
  .flip {
    transform: scaleX(-1);
  }

  #factBox {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.92);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 1.05rem;
    max-width: 70%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.18);
  }
</style>

{% raw %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  const wrapper = document.getElementById("peppa-wrapper");
  const peppa = document.getElementById("peppa");
  const factBox = document.getElementById("factBox");

  const facts = [
    "🐧 Linux was created by Linus Torvalds in 1991.",
    "💻 `make` automates builds so you don’t have to compile manually.",
    "📦 Python `venv` keeps each project’s libraries separate.",
    "🌐 Most servers on the internet run Linux.",
    "🔧 Tux the penguin is the Linux mascot.",
    "🚀 Linux is used in spacecraft, Android phones, and supercomputers."
  ];

  let lastX = 0;
  let walkTimeout;

  document.addEventListener("mousemove", (e) => {
    // Position the wrapper so the image centers on cursor
    wrapper.style.left = (e.clientX - wrapper.offsetWidth / 2) + "px";
    wrapper.style.top  = (e.clientY - wrapper.offsetHeight / 2) + "px";

    // Start walking bounce on wrapper
    wrapper.classList.add("walking");

    // Stop bouncing if mouse stops
    clearTimeout(walkTimeout);
    walkTimeout = setTimeout(() => wrapper.classList.remove("walking"), 300);

    // Flip image left/right by toggling class on the image (no transform conflict)
    if (e.clientX > lastX) {
      peppa.classList.remove("flip"); // face right
    } else if (e.clientX < lastX) {
      peppa.classList.add("flip"); // face left
    }
    lastX = e.clientX;
  });

  // Click anywhere for a fact + color change
  document.addEventListener("click", () => {
    const fact = facts[Math.floor(Math.random() * facts.length)];
    factBox.textContent = fact;
    changeBackground();
  });

  function changeBackground() {
    const r = Math.floor(Math.random() * 200) + 30; // avoid extreme black
    const g = Math.floor(Math.random() * 200) + 30;
    const b = Math.floor(Math.random() * 200) + 30;
    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
  }
});
</script>
{% endraw %}
